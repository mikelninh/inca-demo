name: Prepare browser PDF dependencies (one-shot)
on:
  push:
    branches: [feature/document-decision-lab]
    paths: [.github/workflows/document-lab-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/document-decision-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned local PDF parsing and generator packages
        run: npm install --save-exact pdfjs-dist@6.4.299 pdf-lib@1.17.1
      - name: Commit reproducible package lock to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "chore: lock pdfjs-dist and pdf-lib for document lab"
          git push origin HEAD:feature/document-decision-lab
