name: Lock patched Zod runtime dependency (one-shot)
on:
  push:
    branches: [feature/inca-mission-v04]
    paths: [.github/workflows/mission-zod-lock.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inca-mission-v04
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply safe package override to lock
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit patched dependency tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          git diff --cached --quiet || git commit -m "sec: lock patched zod dependency"
          git fetch origin feature/inca-mission-v04
          git rebase origin/feature/inca-mission-v04
          git push origin HEAD:feature/inca-mission-v04
